<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7HUB GEN - Gerador Spotify Premium</title>
    <link href="css/index.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: #FF0000;
            border-radius: 50%;
            opacity: 0.4;
            animation: float 18s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0.4);
                opacity: 0;
            }

            15% {
                opacity: 0.7;
            }

            85% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-30vh) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 5.5rem;
            color: #FF0000;
            text-shadow: 0 0 30px #FF0000, 0 0 60px #FF0000;
            margin-bottom: 15px;
            animation: neonPulse 1.8s infinite alternate;
        }

        @keyframes neonPulse {
            from {
                text-shadow: 0 0 20px #FF0000, 0 0 40px #FF0000;
            }

            to {
                text-shadow: 0 0 50px #FF0000, 0 0 100px #FF0000, 0 0 150px #FF0000;
            }
        }

        .subtitle {
            font-size: 1.5rem;
            color: #e0e0e0;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        input {
            padding: 18px 25px;
            font-size: 1.4rem;
            width: 180px;
            text-align: center;
            border: 3px solid #FF0000;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            transition: all 0.4s ease;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 25px #FF0000;
            border-color: #FF3333;
            transform: scale(1.05);
        }

        button {
            background: linear-gradient(135deg, #FF0000, #FF3333);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.5s;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
        }

        button:hover {
            transform: translateY(-8px) scale(1.08);
            box-shadow: 0 0 60px #FF0000, 0 0 120px #FF0000;
        }

        #lista {
            margin: 50px 0;
            background: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            border: 2px solid rgba(255, 0, 0, 0.4);
            min-height: 300px;
        }

        .link {
            background: rgba(0, 0, 0, 0.8);
            padding: 18px 25px;
            margin: 15px 0;
            border-radius: 15px;
            word-break: break-all;
            font-size: 1.1rem;
            border-left: 6px solid #FF0000;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s forwards;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        footer {
            margin-top: 80px;
            color: #555;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        footer strong {
            color: #FF0000;
        }
    </style>
</head>

<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <h1>7HUB GEN</h1>
        <p class="subtitle">Gerador de Links Spotify Premium (3 meses free)</p>

        <div class="input-group">
            <input type="number" id="quantidade" value="20" min="1" max="500" placeholder="Quantos links?">
            <button onclick="gerarLinks()">GERAR</button>
        </div>

        <div id="lista"></div>

        <div class="actions">
            <button onclick="copiarTodos()">📋 COPIAR TODOS</button>
            <button onclick="baixarTxt()">⬇️ BAIXAR TXT</button>
        </div>

        <footer>
            Criado por <strong>7deus</strong> 🔥
        </footer>
    </div>

    <script>
        const base = "https://www.spotify.com/br-pt/premium/?utm_source=br-pt_brand_contextual_text&utm_medium=";

        function gerarCodigo() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let code = "";
            for (let i = 0; i < 15; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            return code;
        }

        function gerarLinks() {
            const qtd = parseInt(document.getElementById("quantidade").value) || 20;
            let html = "";
            const links = [];

            for (let i = 0; i < qtd; i++) {
                const codigo = gerarCodigo();
                const link = base + codigo;
                links.push(link);
                html += `<div class="link" style="animation-delay: ${i * 0.08}s;">${link}</div>`;
            }

            document.getElementById("lista").innerHTML = html;
            window.linksGerados = links;
        }

        function copiarTodos() {
            if (!window.linksGerados || window.linksGerados.length === 0) return alert("Gera os links primeiro po!");
            navigator.clipboard.writeText(window.linksGerados.join("\n"));
            alert("Links copiados na área de transferência! Cola onde quiser 🔥");
        }

        function baixarTxt() {
            if (!window.linksGerados || window.linksGerados.length === 0) return alert("Gera os links primeiro po!");
            const blob = new Blob([window.linksGerados.join("\n")], {type: "text/plain"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "snow-spotify-premium-links.txt";
            a.click();
        }

        // Partículas
        function criarParticulas() {
            const particlesDiv = document.getElementById("particles");
            for (let i = 0; i < 40; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                p.style.width = p.style.height = Math.random() * 5 + 3 + "px";
                p.style.left = Math.random() * 100 + "vw";
                p.style.animationDelay = Math.random() * 12 + "s";
                p.style.animationDuration = Math.random() * 25 + 15 + "s";
                particlesDiv.appendChild(p);
            }
        }
        criarParticulas();
    </script>


</body></html>
